name: fray

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label (e.g. ubuntu-26.04, ubuntu-latest)
        required: false
        default: ubuntu-26.04
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  fray:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    services:
      localstack:
        image: localstack/localstack:4.0
        ports:
          - 4566:4566
        env:
          SERVICES: sts
          DEBUG: "0"
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_aws_access_key: test
      TF_VAR_aws_secret_key: test
      TF_VAR_aws_sts_endpoint: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: fluong/fray@e8f4581ae7e15924a50e3d55edbefcfc3365e2c8 # v0.9.0
        with:
          api-url: https://api.getfray.dev
          working-directory: infra
          config: fray.yaml
          redaction-key: ${{ secrets.FRAY_REDACTION_KEY }}
          show-payload: true
